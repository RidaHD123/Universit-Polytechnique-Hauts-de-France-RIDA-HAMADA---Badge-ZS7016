Toutes les options",icon:xr},{id:"teams",label:"Équipes UPHF",icon:Tr},{id:"letters",label:"Lettres • 4 langues",icon:Rr},{id:"documents",label:"Dossier & Portfolio",icon:wn},{id:"plan",label:"Plan d’action",icon:Cr}],nh={FR:{title:"Lettre de candidature — Université Polytechnique Hauts-de-France",subject:"Objet : Candidature à la Licence Professionnelle Métiers de l’Industrie : Mécatronique, Robotique — Parcours Automatisme et Robotique Industrielle, en alternance — Candidat ZS7016",paragraphs:["Madame, Monsieur,","Je me permets de vous adresser ma candidature à l’Université Polytechnique Hauts-de-France, avec un choix clair et mûrement réfléchi : la Licence Professionnelle Métiers de l’Industrie : Mécatronique, Robotique, Parcours Automatisme et Robotique Industrielle, en alternance. J’ai eu le plaisir de découvrir votre établissement lors de l’événement « Study in Europe · Rabat », le dimanche 8 novembre 2026, de 10h à 18h, à l’Hôtel Marriott Rabat, Centre Agdal, avenue Inaouin, Rabat. Mon badge de candidat est le ZS7016.","Je suis Rida Hamada, candidat marocain, âgé de 30 ans, originaire de Safi, au Maroc. Mon parcours est celui d’un technicien de terrain devenu un professionnel de l’automatisation industrielle. Je suis titulaire d’un Baccalauréat Scientifique en Sciences Physiques, puis d’un Diplôme de Technicien Spécialisé en Électromécanique des Systèmes Automatisés, obtenu en 2020. Cette formation de deux ans, de niveau Bac+2 et EQF 5, m’a permis de construire une base solide en électrotechnique, mécanique, pneumatique, hydraulique, régulation et automatismes. Je l’ai validée avec une très bonne mention.","Mon expérience professionnelle m’a ensuite conduit au cœur des installations industrielles les plus exigeantes. Pendant 11 mois, j’ai travaillé pour Actemium / GMCE II à Jorf Lasfar, pour le compte de l’OCP, aux côtés d’équipes intervenant pour TAQA Morocco et STMicroelectronics. J’y ai travaillé sur des turbines, des systèmes de cogénération, du SCADA, du DCS, des interfaces HMI, du protocole HART, des réseaux et équipements 6,6 kV ainsi que des installations de 1 à 36 kV. J’ai également travaillé avec Univers Acier et SE Solution. Ce parcours m’a appris la rigueur, la sécurité, la continuité de production et le travail en équipe pluridisciplinaire.","Parce que l’automatisation évolue chaque jour, j’ai poursuivi ma formation en continu. En 2025, j’ai suivi la formation Cisco en cybersécurité, la certification Azure-900, ainsi que la formation de l’AIEA sur la sécurité de l’information et de l’informatique. J’ai aussi bénéficié de ressources et de programmes liés à la CNUCED. Ces formations m’ont permis de relier la réalité opérationnelle des automates et des réseaux industriels aux enjeux de la cybersécurité, du cloud et de la protection des données.","Mon parcours a également fait l’objet d’une reconnaissance officielle en Allemagne. Par le Bescheid de l’IHK FOSA du 28 mars 2024, n° 23.0063819, ma qualification a été reconnue comme partiellement équivalente à celle d’Elektroniker für Automatisierungstechnik, au niveau EQF 4 / DQR 4, avec environ 4 200 heures reconnues, dans le cadre de la directive 2005/36/CE et des procédures BIBB / IHK. Le Qualifizierungsplan de l’IHK Berlin du 13 janvier 2025, établi par Katja Schefe-Rasokat, précise qu’il ne me manque qu’un seul module : « Digitalisierung der Arbeit, Datenschutz und Informationssicherheit », au sens du §15 Absatz 1 Nummer 5. C’est précisément pour cela que je sollicite aussi une validation par la VAP / VAE et un module de mise à niveau à l’UPHF.","Je choisis la Licence Professionnelle Mécatronique, Robotique parce qu’elle correspond exactement à mon métier et à mon avenir. Je sais déjà intervenir sur des systèmes automatisés, analyser un dysfonctionnement, lire des schémas, travailler en sécurité et dialoguer avec la production. Je veux maintenant apprendre, dans un cadre universitaire français, la robotique industrielle et collaborative, la robotique mobile, la programmation avancée, la vision, l’intégration, la maintenance prédictive et la conduite de projet. Cette licence d’un an, Bac+3, 60 ECTS, EQF 6, en alternance, est pour moi le chemin le plus direct vers un diplôme français reconnu, puis vers un Master ou un diplôme d’ingénieur.","L’alternance est au cœur de mon projet. Je souhaite apprendre à l’université et produire de la valeur en entreprise, dans un environnement réel, avec des responsabilités concrètes. Je suis prêt à m’engager pleinement dans ce rythme exigeant. Je souhaite également contribuer à la dynamique Erasmus+ de l’UPHF. La coopération avec plus de 130 universités partenaires, les mobilités d’études et de stage, et l’ouverture internationale de votre établissement correspondent à mon parcours entre le Maroc, l’Allemagne et la France.","Mon objectif ne s’arrête pas à l’obtention du diplôme. Je souhaite rester travailler en France, dans le cadre prévu après les études, notamment l’Autorisation Provisoire de Séjour de 12 mois, puis la Carte Salarié ou le Passeport Talent. Je veux construire une carrière durable dans l’industrie française, au service d’entreprises qui investissent dans la robotique, l’efficacité énergétique et l’automatisation.","« La science précède la politique. C’est pourquoi je veux des gens de science, pas des gens de politique. » Cette conviction guide ma démarche : je veux apprendre, prouver par le travail et contribuer par la compétence. Je vous joins l’ensemble de mon dossier par le lien Google Drive indiqué dans ce portail, et je reste disponible pour tout entretien, complément d’information ou évaluation.","Je vous remercie sincèrement pour l’attention portée à ma candidature. Dans l’attente de votre retour, je vous prie d’agréer, Madame, Monsieur, l’expression de ma haute considération.",`Rida Hamada — Safi, Maroc
Badge ZS7016 — Hamada.rida.321@proton.me — +212 653 245 840`]},EN:{title:"Application letter — Université Polytechnique Hauts-de-France",subject:"Subject: Application for the Licence Professionnelle Métiers de l’Industrie: Mécatronique, Robotique — Industrial Automation and Robotics pathway, work-study — Candidate ZS7016",paragraphs:["Dear Sir or Madam,","I am writing to apply to Université Polytechnique Hauts-de-France with a clear and carefully considered choice: the Licence Professionnelle Métiers de l’Industrie: Mécatronique, Robotique, Industrial Automation and Robotics pathway, in a work-study format. I had the pleasure of discovering your university at the event “Study in Europe · Rabat”, on Sunday 8 November 2026, from 10:00 to 18:00, at the Hôtel Marriott Rabat, Centre Agdal, avenue Inaouin, Rabat. My candidate badge is ZS7016.","I am Rida Hamada, a Moroccan candidate, 30 years old, from Safi, Morocco. My journey is that of a field technician who became a professional in industrial automation. I hold a Scientific Baccalauréat in Physical Sciences, followed by a Diplôme de Technicien Spécialisé in Electromechanics of Automated Systems, obtained in 2020. This two-year programme, at Bac+2 and EQF 5 level, gave me a solid foundation in electrical engineering, mechanics, pneumatics, hydraulics, control and automation. I completed it with a very good grade.","My professional experience then took me into demanding industrial plants. For 11 months, I worked for Actemium / GMCE II in Jorf Lasfar, for OCP, alongside teams working for TAQA Morocco and STMicroelectronics. I worked on turbines, cogeneration systems, SCADA, DCS, HMI interfaces, the HART protocol, 6.6 kV networks and equipment, and installations from 1 to 36 kV. I also worked with Univers Acier and SE Solution. This experience taught me rigour, safety, production continuity and multidisciplinary teamwork.","Because automation changes every day, I continued to train. In 2025, I completed Cisco Cybersecurity training, the Azure-900 certification, and IAEA training on information and computer security. I also benefited from resources and programmes linked to UNCTAD. These courses helped me connect the operational reality of PLCs and industrial networks with cybersecurity, cloud and data-protection challenges.","My background has also received official recognition in Germany. By the IHK FOSA Bescheid of 28 March 2024, No. 23.0063819, my qualification was recognised as partially equivalent to Elektroniker für Automatisierungstechnik, at EQF 4 / DQR 4, with around 4,200 recognised hours, under Directive 2005/36/EC and the BIBB / IHK procedures. The IHK Berlin Qualifizierungsplan of 13 January 2025, prepared by Katja Schefe-Rasokat, states that only one module remains: “Digitalisierung der Arbeit, Datenschutz und Informationssicherheit”, under §15 Absatz 1 Nummer 5. That is exactly why I am also requesting validation through VAP / VAE and a bridging module at UPHF.","I am choosing the Licence Professionnelle in Mechatronics and Robotics because it matches my profession and my future exactly. I already know how to work on automated systems, analyse a fault, read diagrams, work safely and communicate with production teams. Now I want to learn, in a French university setting, industrial and collaborative robotics, mobile robotics, advanced programming, vision, integration, predictive maintenance and project management. This one-year programme, Bac+3, 60 ECTS, EQF 6, in work-study format, is for me the fastest route to a recognised French qualification, followed by a Master’s degree or an engineering degree.","Work-study learning is at the heart of my project. I want to learn at the university and create real value in a company, in a real environment, with concrete responsibilities. I am ready to commit fully to this demanding rhythm. I also want to contribute to UPHF’s Erasmus+ dynamic. Cooperation with more than 130 partner universities, study and traineeship mobility, and your university’s international openness reflect my own journey between Morocco, Germany and France.","My goal does not stop at graduation. I wish to stay and work in France under the arrangements provided after study, including the 12-month Autorisation Provisoire de Séjour (APS), followed by a Carte Salarié or Passeport Talent. I want to build a lasting career in French industry, serving companies that invest in robotics, energy efficiency and automation.","“Science comes before politics. That is why I want people of science, not people of politics.” This conviction guides my application: I want to learn, to prove myself through work, and to contribute through competence. My complete file is available through the Google Drive link in this portal, and I remain available for any interview, additional information or assessment.","Thank you sincerely for considering my application. I look forward to hearing from you. Yours faithfully,",`Rida Hamada — Safi, Morocco
Badge ZS7016 — Hamada.rida.321@proton.me — +212 653 245 840`]},AR:{title:"رسالة الترشح — جامعة بوليتكنيك أو-دو-فرانس",subject:"الموضوع: الترشح للإجازة المهنية في مهن الصناعة: الميكاترونيك والروبوتات — مسار الأتمتة والروبوتات الصناعية، بالتناوب — المرشح ZS7016",dir:"rtl",paragraphs:["السيدة، السيد المحترم،","أتشرف بتقديم ترشحي إلى جامعة بوليتكنيك أو-دو-فرانس، باختيار واضح ومدروس بعناية: الإجازة المهنية في مهن الصناعة: الميكاترونيك والروبوتات، مسار الأتمتة والروبوتات الصناعية، بنظام التناوب بين الجامعة والمقاولة. وقد سعدت باكتشاف جامعتكم خلال حدث «الدراسة في أوروبا · الرباط»، يوم الأحد 8 نونبر 2026، من الساعة العاشرة صباحا إلى السادسة مساء، بفندق ماريوت الرباط، المركز أكدال، شارع إناوين، الرباط. ورقم شارة المرشح الخاصة بي هو ZS7016.","أنا رضا حمادة، مرشح مغربي، أبلغ من العمر 30 سنة، من مدينة آسفي بالمغرب. مساري هو مسار تقني ميداني أصبح مهنيا في مجال الأتمتة الصناعية. أنا حاصل على شهادة البكالوريا العلمية في العلوم الفيزيائية، ثم على دبلوم التقني المتخصص في الكهروميكانيك للأنظمة الأوتوماتيكية، سنة 2020. وقد منحني هذا التكوين الذي دام سنتين، بمستوى باك+2 والإطار الأوروبي EQF 5، أساسا متينا في الكهرباء والميكانيك والهواء المضغوط والهيدروليك والضبط والأتمتة. وقد حصلت عليه بميزة جيد جدا.","بعد ذلك قادتني تجربتي المهنية إلى قلب منشآت صناعية جد متطلبة. فقد اشتغلت لمدة 11 شهرا لفائدة أكتيميوم / GMCE II بالجرف الأصفر، لحساب المكتب الشريف للفوسفاط، إلى جانب فرق كانت تشتغل لفائدة طاقة المغرب وSTMicroelectronics. واشتغلت على التوربينات وأنظمة التوليد المشترك للطاقة، وأنظمة سكادا وDCS وواجهات HMI وبروتوكول HART وشبكات ومعدات 6.6 كيلوفولت، إضافة إلى منشآت من 1 إلى 36 كيلوفولت. كما اشتغلت مع Univers Acier وSE Solution. وقد علمتني هذه التجربة الدقة والسلامة واستمرارية الإنتاج والعمل الجماعي متعدد التخصصات.","ولأن الأتمتة تتطور كل يوم، واصلت تكويني المستمر. ففي سنة 2025 تابعت تكوين سيسكو في الأمن السيبراني، وشهادة Azure-900، وتكوين الوكالة الدولية للطاقة الذرية في أمن المعلومات والحاسوب. كما استفدت من موارد وبرامج مرتبطة بمؤتمر الأمم المتحدة للتجارة والتنمية. وقد مكنتني هذه التكوينات من الربط بين الواقع العملي للمتحكمات والشبكات الصناعية وتحديات الأمن السيبراني والحوسبة السحابية وحماية المعطيات.","كما حظي مساري باعتراف رسمي في ألمانيا. فبموجب قرار غرفة الصناعة والتجارة IHK FOSA بتاريخ 28 مارس 2024، رقم 23.0063819، تم الاعتراف بمؤهلي باعتباره معادلا جزئيا لمؤهل Elektroniker für Automatisierungstechnik، بمستوى EQF 4 / DQR 4، مع حوالي 4200 ساعة معترف بها، في إطار التوجيه الأوروبي 2005/36/EC وإجراءات BIBB / IHK. ويوضح مخطط التأهيل Qualifizierungsplan الصادر عن غرفة برلين بتاريخ 13 يناير 2025، والذي أعدته Katja Schefe-Rasokat، أنه لا ينقصني سوى وحدة واحدة: «Digitalisierung der Arbeit, Datenschutz und Informationssicherheit»، وفق الفقرة §15 Absatz 1 Nummer 5. ولهذا السبب بالضبط أطلب أيضا المصادقة عبر VAP / VAE ووحدة للجسر والتدارك في جامعة UPHF.","أختار الإجازة المهنية في الميكاترونيك والروبوتات لأنها تطابق تماما مهنتي ومستقبلي. فأنا أعرف مسبقا كيف أتدخل في الأنظمة الأوتوماتيكية، وأحلل الأعطاب، وأقرأ المخططات، وأشتغل في أمان، وأتواصل مع فرق الإنتاج. وأريد الآن أن أتعلم، في إطار جامعي فرنسي، الروبوتات الصناعية والتعاونية، والروبوتات المتنقلة، والبرمجة المتقدمة، والرؤية الصناعية، والإدماج، والصيانة التنبؤية، وتدبير المشاريع. هذه الإجازة التي تدوم سنة واحدة، بمستوى باك+3 و60 وحدة ECTS وEQF 6، بنظام التناوب، هي بالنسبة إلي أسرع طريق نحو دبلوم فرنسي معترف به، ثم نحو الماستر أو دبلوم مهندس.","التناوب في صميم مشروعي. أريد أن أتعلم في الجامعة وأن أخلق قيمة حقيقية داخل المقاولة، في بيئة واقعية، مع مسؤوليات ملموسة. وأنا مستعد للانخراط الكامل في هذا الإيقاع المتطلب. كما أريد أن أساهم في دينامية Erasmus+ في جامعتكم. فالتعاون مع أكثر من 130 جامعة شريكة، وحركية الدراسة والتدريب، والانفتاح الدولي لمؤسستكم، يعكس مساري بين المغرب وألمانيا وفرنسا.","هدفي لا يتوقف عند الحصول على الدبلوم. أريد البقاء والعمل في فرنسا، في إطار الترتيبات المعمول بها بعد الدراسة، ومنها رخصة الإقامة المؤقتة APS لمدة 12 شهرا، ثم بطاقة الأجير أو جواز المواهب Passeport Talent. أريد بناء مسار مهني دائم في الصناعة الفرنسية، في خدمة المقاولات التي تستثمر في الروبوتات والنجاعة الطاقية والأتمتة.","«العلم يسبق السياسة. لذلك أريد رجال العلم، لا رجال السياسة.» هذا الاقتناع يوجه طلبي: أريد أن أتعلم، وأن أثبت نفسي بالعمل، وأن أساهم بالكفاءة. ملفي الكامل متاح عبر رابط Google Drive في هذا الموقع، وأنا رهن إشارتكم لأي مقابلة أو معلومات إضافية أو تقييم.","أشكركم بصدق على الاهتمام الذي ستولونه لترشحي. وفي انتظار جوابكم، تقبلوا، سيدتي، سيدي، فائق التقدير والاحترام.",`رضا حمادة — آسفي، المغرب
شارة ZS7016 — Hamada.rida.321@proton.me — +212 653 245 840`]},DE:{title:"Bewerbungsschreiben — Université Polytechnique Hauts-de-France",subject:"Betreff: Bewerbung für die Licence Professionnelle Métiers de l’Industrie : Mécatronique, Robotique — Fachrichtung Industrieautomation und Robotik, im Wechselmodell — Bewerber ZS7016",paragraphs:["Sehr geehrte Damen und Herren,","ich bewerbe mich an der Université Polytechnique Hauts-de-France mit einer klaren und sorgfältig überlegten Wahl: der Licence Professionnelle Métiers de l’Industrie : Mécatronique, Robotique, Fachrichtung Industrieautomation und Robotik, im Wechselmodell zwischen Hochschule und Unternehmen. Ihre Hochschule habe ich bei der Veranstaltung „Study in Europe · Rabat“ kennengelernt, am Sonntag, dem 8. November 2026, von 10 bis 18 Uhr, im Hôtel Marriott Rabat, Centre Agdal, avenue Inaouin, Rabat. Meine Bewerbernummer lautet ZS7016.","Ich bin Rida Hamada, marokkanischer Bewerber, 30 Jahre alt, aus Safi in Marokko. Mein Weg ist der eines Feldtechnikers, der zu einem Fachmann für Industrieautomation geworden ist. Ich besitze ein wissenschaftliches Baccalauréat in Physikalischen Wissenschaften und anschließend ein Diplôme de Technicien Spécialisé in Elektromechanik automatisierter Systeme, erworben im Jahr 2020. Diese zweijährige Ausbildung auf dem Niveau Bac+2 und EQF 5 gab mir eine solide Grundlage in Elektrotechnik, Mechanik, Pneumatik, Hydraulik, Regelungstechnik und Automatisierung. Ich habe sie mit sehr guter Note abgeschlossen.","Meine Berufserfahrung führte mich danach in anspruchsvolle Industrieanlagen. Elf Monate lang arbeitete ich für Actemium / GMCE II in Jorf Lasfar für OCP, gemeinsam mit Teams, die für TAQA Morocco und STMicroelectronics tätig waren. Ich arbeitete an Turbinen, Kraft-Wärme-Kopplungsanlagen, SCADA, DCS, HMI-Bedienoberflächen, dem HART-Protokoll, 6,6-kV-Netzen und Anlagen sowie Anlagen von 1 bis 36 kV. Außerdem arbeitete ich mit Univers Acier und SE Solution. Diese Erfahrung lehrte mich Präzision, Sicherheit, Produktionskontinuität und interdisziplinäre Teamarbeit.","Weil sich die Automatisierung jeden Tag weiterentwickelt, habe ich mich kontinuierlich weitergebildet. Im Jahr 2025 absolvierte ich eine Cisco-Schulung zur Cybersicherheit, die Azure-900-Zertifizierung sowie eine IAEA-Schulung zur Informations- und Computersicherheit. Außerdem nutzte ich Ressourcen und Programme im Zusammenhang mit der UNCTAD. Diese Weiterbildungen halfen mir, die betriebliche Realität von Steuerungen und Industrienetzen mit den Herausforderungen von Cybersicherheit, Cloud und Datenschutz zu verbinden.","Mein Werdegang wurde auch in Deutschland offiziell anerkannt. Mit dem Bescheid der IHK FOSA vom 28. März 2024, Nr. 23.0063819, wurde meine Qualifikation als teilweise gleichwertig mit dem Beruf Elektroniker für Automatisierungstechnik anerkannt, auf dem Niveau EQF 4 / DQR 4, mit etwa 4.200 anerkannten Stunden, im Rahmen der Richtlinie 2005/36/EG und der BIBB-/IHK-Verfahren. Der Qualifizierungsplan der IHK Berlin vom 13. Januar 2025, erstellt von Katja Schefe-Rasokat, stellt fest, dass nur noch ein Modul fehlt: „Digitalisierung der Arbeit, Datenschutz und Informationssicherheit“ gemäß §15 Absatz 1 Nummer 5. Genau deshalb bitte ich bei der UPHF auch um eine Validierung über VAP / VAE und um ein Brückenmodul.","Ich wähle die Licence Professionnelle Mechatronik und Robotik, weil sie genau meinem Beruf und meiner Zukunft entspricht. Ich kann bereits an automatisierten Systemen arbeiten, Störungen analysieren, Schaltpläne lesen, sicher arbeiten und mit Produktionsteams kommunizieren. Jetzt möchte ich in einem französischen Hochschulumfeld industrielle und kollaborative Robotik, mobile Robotik, fortgeschrittene Programmierung, Bildverarbeitung, Integration, vorausschauende Instandhaltung und Projektmanagement lernen. Diese einjährige Ausbildung, Bac+3, 60 ECTS, EQF 6, im Wechselmodell, ist für mich der schnellste Weg zu einem anerkannten französischen Abschluss und danach zu einem Master oder einem Ingenieurdiplom.","Das Wechselmodell steht im Mittelpunkt meines Projekts. Ich möchte an der Hochschule lernen und im Unternehmen echten Wert schaffen, in einer realen Umgebung, mit konkreten Verantwortlichkeiten. Ich bin bereit, mich diesem anspruchsvollen Rhythmus voll zu widmen. Außerdem möchte ich zur Erasmus+-Dynamik der UPHF beitragen. Die Zusammenarbeit mit mehr als 130 Partnerhochschulen, Studien- und Praktikumsmobilität sowie die internationale Offenheit Ihrer Hochschule spiegeln meinen eigenen Weg zwischen Marokko, Deutschland und Frankreich wider.","Mein Ziel endet nicht mit dem Abschluss. Ich möchte in Frankreich bleiben und arbeiten, im Rahmen der nach dem Studium vorgesehenen Regelungen, insbesondere der 12-monatigen Autorisation Provisoire de Séjour (APS), danach der Carte Salarié oder des Passeport Talent. Ich möchte eine dauerhafte Karriere in der französischen Industrie aufbauen und Unternehmen dienen, die in Robotik, Energieeffizienz und Automatisierung investieren.","„Die Wissenschaft kommt vor der Politik. Deshalb will ich Menschen der Wissenschaft, nicht Menschen der Politik.“ Diese Überzeugung leitet meine Bewerbung: Ich will lernen, mich durch Arbeit beweisen und durch Kompetenz beitragen. Meine vollständige Bewerbung ist über den Google-Drive-Link in diesem Portal verfügbar, und ich stehe für jedes Gespräch, jede zusätzliche Information oder Bewertung gern zur Verfügung.","Ich danke Ihnen herzlich für die Berücksichtigung meiner Bewerbung. Mit freundlichen Grüßen und vorzüglicher Hochachtung,",`Rida Hamada — Safi, Marokko
