<script>
// GitHub Pages 404 fix - redirect to index.html keeping repo path
(function(){
  var path = window.location.pathname;
  // Get repo base: /<repo>/...
  var parts = path.split('/').filter(Boolean);
  var base = parts.length > 0 ? '/' + parts[0] + '/' : '/';
  // If already on index, do nothing
  // Redirect to index.html in same repo
  var target = base + 'index.html';
  // Keep query if any
  if (window.location.search) target += window.location.search;
  // Avoid loop: if we are already on index.html, stop
  if (path.endsWith('index.html') || path === base || path === base.slice(0,-1)) {
    return;
  }
  window.location.replace(target);
})();
</script>
